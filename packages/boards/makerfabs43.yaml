# ESP Screens - Makerfabs E32S3RGB43 V3.1: a 4.3-inch 800 x 480 RGB panel with GT911 capacitive touch,
# an ESP32-S3 with 16 MB flash and 8 MB octal PSRAM.
#
# This test profile assumes the V2.0+ Makerfabs backlight modification is fitted: R59 connects GPIO44/RXD0 to the
# backlight transistor and R29 is removed so the onboard CP2104 TX output no longer drives the same line. With that
# modification GPIO44 can dim the backlight with PWM. Stock boards without the modification remain lit continuously.
# GPIO2 is deliberately left free for the board's I2S LRCLK (audio uses GPIO2/19/20).
#
# The RGB pins, 16 MHz pixel clock and panel timings below were tried on the glass on 2026-10-29 with ESPHome
# 2026.10.1. The GT911 answers at 0x5D on GPIO17/18; on the newer Makerfabs hardware GPIO38 is the GT911 reset line
# and no separate interrupt pin is used.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together and docs/ADDING_A_BOARD.md how a
# board like this one is added.
packages:
  hardware: !include ../hardware/esp32s3-rgb.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "makerfabs43"
  DEVICE_NAME: "makerfabs43-new"
  DEVICE_FRIENDLY_NAME: "My Makerfabs"

  # The glass: 933 diagonal pixels over 4.3 inches.
  PANEL_W: "800"
  PANEL_H: "480"
  DISPLAY_DPI: "216.966"
  # The same 4.3-inch 800 x 480 glass density as the Waveshare 4.3: nine cards lying down, four standing up.
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "4"
  # The tile list, cards and extras live in PSRAM on this ESP32-S3.
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"
  LVGL_BUFFER_SIZE: "12%"

  # R59 + R29 modification exposes the backlight transistor on GPIO44, so Tessera may offer brightness controls.
  BACKLIGHT_DIMMABLE: "true"
  CAN_STANDBY: "true"

  # Same glass, density and 3-row layout as the Waveshare 4.3.
  GRID_GAP_Y: "13"

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

logger:
  tx_buffer_size: 2048
  # The ESP32-S3's native USB port carries the serial log. GPIO44 remains free for the modified backlight.
  hardware_uart: USB_SERIAL_JTAG

# The GT911 has the board's I2C bus to itself.
i2c:
  id: touch_bus
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz
  scan: true

# On a modified V2.0+/V3.1 board R59 routes GPIO44/RXD0 to Q7, the backlight transistor. R29 must be removed so the
# CP2104's TX output does not fight the PWM signal. 1 kHz is well above visible flicker while retaining fine LEDC duty
# resolution. A stock, unmodified board ignores this output and its backlight remains permanently on.
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO44
    frequency: 1000 Hz

# Newer Makerfabs revisions route GT911 reset to GPIO38 and do not use a separate interrupt line.
touchscreen:
  - platform: gt911
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin:
      number: GPIO38
      mode:
        output: true
    update_interval: 20ms

# Makerfabs' 800 x 480 RGB565 panel. It needs no SPI init sequence; model RPI is ESPHome's custom RGB panel base.
display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    dimensions:
      width: ${PANEL_W}
      height: ${PANEL_H}
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 88
    vsync_front_porch: 13
    vsync_pulse_width: 3
    vsync_back_porch: 32
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false
