# ESP Screens - test package for Makerfabs E32S3RGB43 V3.1.
#
# TEST-BRANCH NOTE: while the board is being validated on real hardware, fonts and the smart_display component are
# intentionally loaded from lubu2804/homeassistant_espscreen, branch feat/makerfabs43-v31. Before an upstream PR this
# file must be regenerated by tools/generate_entries.py so it points at MaxGramser/homeassistant_espscreen again.
substitutions:
  GITHUB_REF: "feat/makerfabs43-v31"
  FONT_DIR: "https://raw.githubusercontent.com/lubu2804/homeassistant_espscreen/${GITHUB_REF}/fonts"

packages:
  core: !include core.yaml
  board: !include boards/makerfabs43.yaml
  hotspot: !include features/hotspot.yaml

external_components:
  - source:
      type: git
      url: https://github.com/lubu2804/homeassistant_espscreen.git
      ref: ${GITHUB_REF}
      path: components
    refresh: 0s
    components: [smart_display]
